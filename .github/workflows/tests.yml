name: API Test Suite — User Management

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allows manual execution from GitHub UI

# Permissions needed to publish to ghcr.io from the pipeline
permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job BUILD — builds the image from server/ and pushes to ghcr.io
  # All test jobs depend on this and use the image it produces.
  # ─────────────────────────────────────────────────────────────
  build-api:
    name: "Build & Push API Image"
    runs-on: ubuntu-latest

    outputs:
      # Pass the exact image digest to test jobs so they pull the right build
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build metadata: tag as ghcr.io/<owner>/<repo>/user-api:latest
      # and also with the short commit SHA for traceability
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/user-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers across runs using ghcr.io to speed up re-builds
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/user-api:buildcache
          cache-to:   type=registry,ref=ghcr.io/${{ github.repository }}/user-api:buildcache,mode=max

  # ─────────────────────────────────────────────────────────────
  # Job DEV
  # ─────────────────────────────────────────────────────────────
  test-dev:
    name: "E2E Tests — DEV"
    runs-on: ubuntu-latest
    needs: build-api   # wait for the image to be built first

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline --save-dev
          allure --version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Use the image built in build-api, not the original candidate image
      - name: Start API container
        run: |
          docker run -d -p 3000:3000 \
            --name api-dev \
            ghcr.io/${{ github.repository }}/user-api:latest

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API..."
          for i in {1..15}; do
            if curl -sf http://localhost:3000/dev/users > /dev/null; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run DEV tests
        env:
          DEV_AUTH_TOKEN: ${{ secrets.DEV_AUTH_TOKEN }}
        run: |
          python3 -m behave -D env=dev \
            --tags="@dev" \
            --format allure_behave.formatter:AllureFormatter \
            -o reports/allure-results \
            --format pretty \
            --no-capture
        continue-on-error: false

      - name: Generate Allure Report
        if: always()
        run: allure generate reports/allure-results -o reports/allure-html --clean --single-file

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-dev
          path: reports/allure-html
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job PROD
  # ─────────────────────────────────────────────────────────────
  test-prod:
    name: "E2E Tests — PROD"
    runs-on: ubuntu-latest
    needs: build-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline --save-dev
          allure --version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start API container
        run: |
          docker run -d -p 3000:3000 \
            --name api-prod \
            ghcr.io/${{ github.repository }}/user-api:latest

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API..."
          for i in {1..15}; do
            if curl -sf http://localhost:3000/prod/users > /dev/null; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run PROD tests
        env:
          PROD_AUTH_TOKEN: ${{ secrets.PROD_AUTH_TOKEN }}
        run: |
          python3 -m behave -D env=prod \
            --tags="@prod" \
            --format allure_behave.formatter:AllureFormatter \
            -o reports/allure-results \
            --format pretty \
            --no-capture
        continue-on-error: false

      - name: Generate Allure Report
        if: always()
        run: allure generate reports/allure-results -o reports/allure-html --clean --single-file

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-prod
          path: reports/allure-html
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job SECURITY
  # ─────────────────────────────────────────────────────────────
  test-security:
    name: "Security Tests — DEV"
    runs-on: ubuntu-latest
    needs: test-dev   # run after DEV so the infra is proven healthy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline --save-dev
          allure --version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start API container
        run: |
          docker run -d -p 3000:3000 \
            --name api-security \
            ghcr.io/${{ github.repository }}/user-api:latest

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API..."
          for i in {1..15}; do
            if curl -sf http://localhost:3000/dev/users > /dev/null; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run Security tests
        env:
          DEV_AUTH_TOKEN: ${{ secrets.DEV_AUTH_TOKEN }}
        run: |
          python3 -m behave -D env=dev \
            --tags="@security" \
            --format allure_behave.formatter:AllureFormatter \
            -o reports/allure-results \
            --format pretty \
            --no-capture
        # continue-on-error: true — security scenarios are contract gap warnings,
        # not hard blockers until input constraints are added to the spec.
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: allure generate reports/allure-results -o reports/allure-html --clean --single-file

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-security
          path: reports/allure-html
          retention-days: 7
